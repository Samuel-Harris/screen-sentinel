[workspace]
members = [
    "crates/*",
    "apps/screen-sentinel-app-tauri/src-tauri",
]
exclude = [
    "crates/screen-sentinel-integrations",
]
resolver = "2"

[workspace.package]
version = "0.4.15"
authors = ["louis030195 <hi@louis030195.com>"]
description = ""
repository = "https://github.com/Samuel-Harris/screen-sentinel"
license = "MIT OR Apache-2.0"
edition = "2021"

[workspace.dependencies]
# AI
tokenizers = "0.21.0"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "chrono"] }
tracing-appender = { version = "0.2.3" }
tokio = { version = "1.15", features = ["full", "tracing"] }
crossbeam = "0.8.4"
dashmap = "6.1.0"
image = "0.25"
criterion = { version = "0.5.1", features = ["async_tokio"] }
cc = "1.0"
oasgen = { version = "0.22.0", features = ["axum", "chrono"] }
once_cell = "1.20.2"
tracing-oslog = "0.3.0"

http-cache-reqwest = "0.15.0"
# reqwest 0.13 renamed `rustls-tls` → `rustls` and folded the native-roots
# variants into `rustls-platform-verifier` (which the `rustls` feature pulls
# in automatically). The `rustls` feature bundles aws-lc-rs as the provider;
# Windows MSVC links cleanly because of bswap_shim.c in the tauri app crate.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "multipart", "json", "form", "query", "rustls"] }
reqwest-middleware = "0.4.1"

[patch.crates-io]
# macOS tray menus can outlive the Rust `Menu` that created them while the
# native menu is open. This fork stores an Rc<MenuChild> on NSMenuItem instead
# of a raw pointer so stale AppKit items keep their Rust click data alive.
# Pinned by commit (not branch) for reproducible builds; drop once
# upstream tauri-apps/muda#361 merges and ships in a released muda.
muda = { git = "https://github.com/divanshu-go/muda", rev = "9dc5de53e84040a63c9a5423b669ec892de8a671" }


[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Fast local release builds: cargo build --profile release-dev
# ~3-5x faster than full release, still optimized for testing
[profile.release-dev]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true

# Maximum-speed local builds for updater e2e harness — no optimization, fastest compile.
# Trades runtime perf and binary size for compile speed.
[profile.release-local]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
opt-level = 1
debug = false

# Faster dev builds - optimize dependencies but keep local code debuggable
[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 2      # Optimize all dependencies (faster runtime, same compile time)
debug = false      # deps don't need debug symbols — keeps target/ from ballooning
