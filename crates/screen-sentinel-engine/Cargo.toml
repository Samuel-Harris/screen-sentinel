[package]
name = "screen-sentinel-engine"
version = { workspace = true }
authors = { workspace = true }
description = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
oasgen = { workspace = true }

screen-sentinel-events = { path = "../screen-sentinel-events" }
screen-sentinel-screen = { path = "../screen-sentinel-screen" }
screen-sentinel-core = { path = "../screen-sentinel-core", features = ["security"] }
screen-sentinel-db = { path = "../screen-sentinel-db" }
screen-sentinel-redact = { path = "../screen-sentinel-redact", features = ["opf-text"] }
screen-sentinel-a11y = { path = "../screen-sentinel-a11y", features = ["db"] }
screen-sentinel-capture = { path = "../screen-sentinel-capture" }
screen-sentinel-config = { path = "../screen-sentinel-config" }
screen-sentinel-vault = { path = "../screen-sentinel-vault" }
screen-sentinel-secrets = { path = "../screen-sentinel-secrets" }


# Image processing
image = { workspace = true }
imageproc = "0.25"

# Dates
chrono = { version = "0.4.31", features = ["serde"] }

# Database
sqlx = { version = "0.7", features = [
    "sqlite",
    "runtime-tokio-rustls",
    "chrono",
    "migrate",
] }

anyhow = "1.0.86"
moka = { version = "0.12", features = ["future"] }

# Server
axum = { version = "0.7.5", features = ["ws", "multipart"] }
http-body-util = "0.1"
tokio = { version = "1.15", features = ["full", "tracing"] }
tower-http = { version = "0.5.2", features = ["cors", "trace"] }

# Log
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
console-subscriber = { version = "0.4.1", optional = true }
# Cli ! shouldn't be required if using as lib
clap = { version = "4.3", features = ["derive", "env"] }

# Memory watchdog
sysinfo = "0.29.0"

# Color
colored = "2.0"

# Plugins
futures = { version = "0.3.31", features = ["std"] }

# Directory management
dirs = "5.0"

# Password input (no-echo for vault CLI)
rpassword = "5"

# Client http
reqwest = { workspace = true }

# Tinfoil enclave attestation: AMD SEV-SNP attestation + Sigstore code-provenance
# verification + TLS cert pinning for the privacy-filter PII redaction service
# (see src/privacy_filter.rs). Without this, a MITM or compromised CA could
# observe unredacted text on its way to the enclave.
# Upstream tinfoilsh/tinfoil-rs main, post-#21 (the ring-backend fix).
tinfoil = { git = "https://github.com/tinfoilsh/tinfoil-rs", rev = "82143d767b540195dea265df0b01c4b4fc93c424" }

# Concurrency
crossbeam = { workspace = true }

# base64
base64 = "0.22.1"

uuid = { version = "1.5.0", features = ["v4"] }

hostname = "0.4"

tempfile = "3.3.0"


# Bincode for serializing hot cache
bincode = "1.3.3"

# SHA256 for hashing
sha2 = "0.10.6"

# Fast random number generator
fastrand = "2.1.1"
port_check = "0.2.1"

regex = "1.10.0"

lru = "0.16.3"
tokio-util = { version = "0.7", features = ["io"] }

once_cell = { workspace = true }
dashmap = { workspace = true }
arc-swap = "1"

# Heap profiling (opt-in via --features heap-prof)
dhat = { version = "0.3", optional = true }

# jemalloc — aggressively returns freed pages to OS, reducing RSS bloat from fragmentation.
# Default allocator on macOS/Linux. Not used on Windows (unsupported).
[target.'cfg(not(target_os = "windows"))'.dependencies]
tikv-jemallocator = { version = "0.6", optional = true }

[dev-dependencies]
env_logger = "0.10"
tempfile = "3.3.0"
tokio-tungstenite = "0.24"
tower = { version = "0.4", features = ["util"] }

# Benches
criterion = { workspace = true }

[features]
# redact-onnx-cpu is in defaults because screen-sentinel-engine.rs unconditionally
# imports `screen_sentinel_redact::adapters::onnx` for the async PII worker. Without
# it, `cargo {check,clippy,build} -p screen-sentinel-engine` (no --features) fails
# to compile. Mac/Win release builds layer redact-onnx-{coreml,directml} on top.
default = ["redact-onnx-cpu"]
heap-prof = ["dhat"]
debug-console = ["console-subscriber"]
# Image-PII detector via MLX (Apple Silicon-only). Compiled into macOS
# release builds for experiments, but the CLI runtime keeps ONNX as the
# default stable path unless SCREEN_SENTINEL_ENABLE_EXPERIMENTAL_RFDETR_MLX=1
# is set.
rfdetr-mlx = ["screen-sentinel-redact/mlx-mac"]

# v45 phase 3 text-PII redactor via ONNX Runtime. CPU baseline for
# Linux + the foundation for the GPU EPs below. ~280 MB INT8 model
# downloaded on first run.
redact-onnx-cpu = ["screen-sentinel-redact/onnx-cpu"]
# Mac: CoreML EP on top of CPU baseline. Apple Silicon picks up Metal
# + Neural Engine. Stock-OS dependency — no separate install.
redact-onnx-coreml = ["screen-sentinel-redact/onnx-coreml"]
# Windows: DirectML EP on top of CPU baseline. Any DX12-capable GPU
# (NVIDIA, AMD, Intel iGPU). Stock-OS dependency — DirectML.dll ships
# in Windows 10+ since 2019.
redact-onnx-directml = ["screen-sentinel-redact/onnx-directml"]

jemalloc = ["tikv-jemallocator"]

[[bin]]
name = "screen-sentinel"
path = "src/bin/screen-sentinel-engine.rs"

[[bench]]
name = "hot_frame_cache"
harness = false

[[bench]]
name = "alloc_counter"
harness = false


[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Foundation",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }
socket2 = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { git = "https://github.com/yury/cidre.git", rev = "8481f3f0dc7dd39bb5be80d9424bfac0cad3801a", features = ["ax", "ns", "blocks"] }
tracing-oslog = { workspace = true }

[package.metadata.cargo-machete]
# screen-sentinel-redact is wired into the engine binary (image-PII
# reconciliation worker, screen-sentinel-engine.rs:1571).
ignored = []

[package.metadata.nx]
tags = ["type:lib", "scope:engine", "lang:rust"]
