name: Test CLI npm (blank slate)

on:
  workflow_dispatch:

jobs:
  test-macos-arm64:
    runs-on: macos-latest  # Apple Silicon (M1)
    steps:
      - name: Verify blank slate
        run: |
          echo "--- system info ---"
          uname -a
          echo "--- no Screen Sentinel installed ---"
          which screen-sentinel 2>/dev/null && echo "FAIL: Screen Sentinel already in PATH" && exit 1 || echo "OK: not installed"
          echo "--- node/bun ---"
          node --version || true
          which bun || echo "no bun"

      - name: Install bun
        run: curl -fsSL https://bun.sh/install | bash

      - name: Test bunx screen-sentinel status
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          echo "--- running: bunx screen-sentinel@0.3.139 status ---"
          bunx screen-sentinel@0.3.139 status 2>&1 || true
          echo "--- exit code: $? ---"

      - name: Test bunx screen-sentinel --help
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bunx screen-sentinel@0.3.139 --help 2>&1

      - name: Test bunx screen-sentinel record (5s timeout)
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          echo "--- running: bunx screen-sentinel record (expect permission error on CI) ---"
          timeout 15 bunx screen-sentinel@0.3.139 record 2>&1 || echo "--- exited (expected on CI due to screen recording permission) ---"

  test-macos-x64:
    runs-on: macos-13  # Intel
    steps:
      - name: Verify blank slate
        run: |
          uname -a
          which screen-sentinel 2>/dev/null && exit 1 || echo "OK: not installed"

      - name: Install bun
        run: curl -fsSL https://bun.sh/install | bash

      - name: Test bunx screen-sentinel status
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bunx screen-sentinel@0.3.139 status 2>&1 || true

      - name: Test bunx screen-sentinel --help
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bunx screen-sentinel@0.3.139 --help 2>&1

  test-windows:
    runs-on: windows-latest
    steps:
      - name: Verify blank slate
        shell: pwsh
        run: |
          Get-ComputerInfo | Select-Object OsName, OsArchitecture
          $found = (Get-Command screen-sentinel -ErrorAction SilentlyContinue)
          if ($found) { Write-Error "Screen Sentinel already installed"; exit 1 }
          Write-Output "OK: not installed"

      - name: Install bun
        shell: pwsh
        run: irm https://bun.sh/install.ps1 | iex

      - name: Test bunx screen-sentinel status
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.bun\bin;$env:PATH"
          bunx screen-sentinel@0.3.139 status 2>&1
          Write-Output "exit code: $LASTEXITCODE"

      - name: Test bunx screen-sentinel --help
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.bun\bin;$env:PATH"
          bunx screen-sentinel@0.3.139 --help 2>&1

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Verify blank slate
        run: |
          uname -a
          which screen-sentinel 2>/dev/null && exit 1 || echo "OK: not installed"

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y libpulse0 libasound2-dev ffmpeg

      - name: Install bun
        run: curl -fsSL https://bun.sh/install | bash

      - name: Test bunx screen-sentinel status
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bunx screen-sentinel@0.3.139 status 2>&1 || true

      - name: Test bunx screen-sentinel --help
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bunx screen-sentinel@0.3.139 --help 2>&1
