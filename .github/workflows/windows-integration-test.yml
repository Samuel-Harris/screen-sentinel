name: Windows CLI Integration Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # Cancel only on PR re-pushes. Main runs use a per-commit group so this
  # long job cannot leave the latest merge pending behind an older commit.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GIT_LFS_SKIP_SMUDGE: 1

jobs:
  affected:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.tasks.outputs.run }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.10

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Check whether the engine is affected
      id: tasks
      env:
        NX_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
      run: |
        if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
          echo "run=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        tasks=$(.github/scripts/affected-tasks.sh -t build --exclude='!screen-sentinel-engine')
        echo "Affected engine build tasks: $tasks"
        if [ "$tasks" -gt 0 ]; then echo "run=true"; else echo "run=false"; fi >> "$GITHUB_OUTPUT"

  test-windows:
    needs: affected
    if: needs.affected.outputs.run == 'true'
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Install Rust
      run: |
        Invoke-WebRequest https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-gnu/rustup-init.exe -OutFile rustup-init.exe
        .\rustup-init.exe -y

    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        override: true
        cache: true
        rustflags: ""

    - name: Install Chocolatey
      run: |
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        Set-ExecutionPolicy Bypass -Scope Process -Force; [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072; iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))

    - name: Install dependencies
      shell: pwsh
      run: |
        # openssl is preinstalled on the windows-2022 runner and already on PATH
        # (e2e-test.yml mints the same Scream cert with no choco openssl). Installing
        # it via choco breaks when slproweb.com 404s the latest OpenSSL installer.
        choco install ffmpeg
        echo "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Setup MSVC Dev Cmd
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install 7zip
      shell: powershell
      run: |
        $7zipUrl = "https://7-zip.org/a/7z2301-x64.exe"
        $7zipInstaller = "7z-installer.exe"
        Invoke-WebRequest -Uri $7zipUrl -OutFile $7zipInstaller
        Start-Process -FilePath .\$7zipInstaller -Args "/S" -Wait
        Remove-Item $7zipInstaller
        echo "C:\Program Files\7-Zip" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Download ONNX Runtime (CPU)
      shell: pwsh
      run: |
        $url = "https://github.com/microsoft/onnxruntime/releases/download/v1.22.0/onnxruntime-win-x64-1.22.0.zip"
        $zipFile = "onnxruntime-win-x64-1.22.0.zip"
        $extractDir = "apps/screen-sentinel-app-tauri/src-tauri/onnxruntime-win-x64-1.22.0"
        Invoke-WebRequest -Uri $url -OutFile $zipFile
        if (Test-Path $extractDir) { Remove-Item $extractDir -Recurse -Force }
        7z x $zipFile -o"apps/screen-sentinel-app-tauri/src-tauri/" -y
        Write-Host "ONNX Runtime extracted to $extractDir"

    - name: Setup OpenBLAS
      shell: pwsh
      run: |
        cd apps/screen-sentinel-app-tauri
        bun scripts/setup_openblas.js
        "OPENBLAS_PATH=${{ github.workspace }}/apps/screen-sentinel-app-tauri/src-tauri/openblas" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Build CLI
      env:
        RUSTFLAGS: "-C link-arg=/LTCG"
        ORT_STRATEGY: system
        ORT_LIB_LOCATION: ${{ github.workspace }}/apps/screen-sentinel-app-tauri/src-tauri/onnxruntime-win-x64-1.22.0
        OPENBLAS_PATH: ${{ github.workspace }}/apps/screen-sentinel-app-tauri/src-tauri/openblas
        # Use prebuilt NASM objects on Windows: https://aws.github.io/aws-lc-rs/requirements/windows.html#prebuilt-nasm-objects
        AWS_LC_SYS_PREBUILT_NASM: "1"
      run: cargo build --release -p screen-sentinel-engine --bin Screen Sentinel --target x86_64-pc-windows-msvc

    - name: Run CLI and generate activity
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $env:RUST_LOG = "debug"
        $screenSentinelDir = Join-Path $env:RUNNER_TEMP "screen-sentinel-ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
        if (Test-Path $screenSentinelDir) {
          Remove-Item $screenSentinelDir -Recurse -Force
        }
        New-Item -ItemType Directory -Path $screenSentinelDir -Force | Out-Null
        $exePath = if (Test-Path ".\target\x86_64-pc-windows-msvc\release\screen-sentinel.exe") {
          ".\target\x86_64-pc-windows-msvc\release\screen-sentinel.exe"
        } else {
          ".\target\release\screen-sentinel.exe"
        }
        $binDir = Split-Path $exePath
        function Copy-DllIfMissing($source, $destinationDirectory) {
          $destination = Join-Path $destinationDirectory (Split-Path $source -Leaf)
          if (-not (Test-Path $destination)) {
            Copy-Item $source $destinationDirectory -Force
          }
        }

        # Copy runtime DLLs next to the binary unless the build already staged them.
        $ortDll = "apps\screen-sentinel-app-tauri\src-tauri\onnxruntime-win-x64-1.22.0\lib\onnxruntime.dll"
        if (Test-Path $ortDll) {
          Copy-DllIfMissing $ortDll $binDir
        }
        $openblasBin = "apps\screen-sentinel-app-tauri\src-tauri\openblas\bin"
        if (Test-Path $openblasBin) {
          Get-ChildItem "$openblasBin\*.dll" | ForEach-Object {
            Copy-DllIfMissing $_.FullName $binDir
          }
        }
        $arguments = @(
          "record",
          "--debug",
          "--data-dir",
          $screenSentinelDir
        )
        $process = Start-Process -FilePath $exePath -ArgumentList $arguments -PassThru -RedirectStandardOutput "screen_sentinel_output.log" -RedirectStandardError "screen_sentinel_error.log" -NoNewWindow
        try {
          Start-Sleep -Seconds 10
          if ($process.HasExited) {
            Write-Host "CLI exited during startup with code $($process.ExitCode)"
            Get-Content "screen_sentinel_output.log" -ErrorAction SilentlyContinue
            Get-Content "screen_sentinel_error.log" -ErrorAction SilentlyContinue
            throw "CLI exited during startup with code $($process.ExitCode)"
          }

          # Generate some screen activity
          for ($i = 0; $i -lt 5; $i++) {
            Start-Process "notepad.exe"
            Start-Sleep -Seconds 2
            Stop-Process -Name "notepad" -Force
            Start-Sleep -Seconds 2
          }

          Start-Sleep -Seconds 30  # Allow more time for processing
        } finally {
          if ($process -and -not $process.HasExited) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
        }

    - name: Check for crashes and captured data
      shell: pwsh
      run: |
        if (Select-String -Path "screen_sentinel_output.log" -Pattern "panic" -Quiet) {
          Write-Host "CLI crashed"
          Get-Content "screen_sentinel_output.log"
          exit 1
        }
        Write-Host "CLI ran successfully without crashing"

        $screenSentinelDir = Join-Path $env:RUNNER_TEMP "screen-sentinel-ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
        $dataDir = Join-Path $screenSentinelDir "data"
        if (-not (Test-Path $dataDir)) {
          Write-Host "No Screen Sentinel data directory was created at $dataDir"
          Get-Content "screen_sentinel_output.log" -Tail 100 -ErrorAction SilentlyContinue
          Get-Content "screen_sentinel_error.log" -ErrorAction SilentlyContinue
          exit 1
        }
        $capturedFiles = Get-ChildItem -Path $dataDir -Recurse
        if ($capturedFiles.Count -eq 0) {
          Write-Host "No data was captured"
          exit 1
        }
        Write-Host "Data captured successfully. File count: $($capturedFiles.Count)"
        
        Get-Content "screen_sentinel_output.log" -Tail 100
        Get-Content "screen_sentinel_error.log"

    - name: Upload logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: screen-sentinel-logs
        include-hidden-files: true
        path: |
          screen_sentinel_output.log
          screen_sentinel_error.log

    - name: Upload data
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: screen-sentinel-data
        include-hidden-files: true
        path: |
          ${{ runner.temp }}/screen-sentinel-ci-${{ github.run_id }}-${{ github.run_attempt }}/*
